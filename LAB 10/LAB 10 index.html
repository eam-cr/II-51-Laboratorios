<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vite + React (Single File)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #242424;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #root {
      width: 100%;
      max-width: 520px;
      padding: 40px 16px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    /* LOGO */
    .logos {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .logo {
      transition: transform 0.3s ease;
    }

    /* Boton y tarjeta */
    .card button,
    .like-btn {
      background: #1a1a1a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      margin: 10px 0;
    }

    .card button:hover,
    .like-btn:hover {
      background: #333;
    }

    /* AVATAR */
    .avatar {
      background: #fff;
      margin: 20px auto;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    /* USERS */
    .users {
      margin-top: 25px;
      border: 1px solid #2f9ed6;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 20px;
    }

    .user {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      padding: 12px;
      border-bottom: 1px solid #333;
    }

    .user:last-child {
      border-bottom: none;
    }

    .status {
      background: #111;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-right: 10px;
    }

    .user-info {
      flex: 1;
      text-align: left;
      font-size: 14px;
    }

    .delete {
      background: red;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .read-the-docs {
      color: #888;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div id="root"></div>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const { useState } = React;

  function LikeButton() {
    const [liked, setLiked] = useState(false);
  }

  function App() {
    const [count, setCount] = useState(0);

    const [users, setUsers] = useState([
      { name: "Andrea Martínez", email: "andrea@email.com" },
      { name: "Verónica Ríos", email: "veronica@email.com" },
      { name: "Juan Navarro", email: "juan@email.com" }
    ]);

    // Escala para logos
    const scale = 1 + count * 0.1;

    // Tamaño del avatar
    const avatarSize = 90 + count * 10;

    const avatarUrl =
      "https://cdn-icons-png.flaticon.com/512/4140/4140048.png";

    const removeUser = (index) => {
      setUsers(users.filter((_, i) => i !== index));
    };

    return (
      <>
        {/* LOGOS */}
        <div className="logos">
          <a href="https://vite.dev" target="_blank" rel="noreferrer">
            <img
              src="https://vitejs.dev/logo.svg"
              alt="Vite logo"
              className="logo"
              style={{ transform: `scale(${scale})` }}
              width="80"
            />
          </a>

          <a href="https://react.dev" target="_blank" rel="noreferrer">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg"
              alt="React logo"
              className="logo"
              style={{ transform: `scale(${scale})` }}
              width="80"
            />
          </a>
        </div>

        <h1>Vite + React</h1>

        <div className="card">
          <button onClick={() => setCount(count + 1)}>
            count is {count}
          </button>
        </div>

        <LikeButton />

        {/* AVATAR */}
        <div
          className="avatar"
          style={{ width: avatarSize, height: avatarSize }}
        >
          <img src={avatarUrl} alt="Avatar" />
        </div>

        <p className="info">
          Click on the Vite and React logos to learn more
        </p>

        {/* USERS */}
        <div className="users">
          {users.map((u, i) => (
            <div className="user" key={i}>
              <span className="status">Activo</span>
              <div className="user-info">
                {u.name} - {u.email}
              </div>
              <button className="delete" onClick={() => removeUser(i)}>
                X
              </button>
            </div>
          ))}
        </div>

        <p className="read-the-docs">
          Click on the Vite and React logos to learn more
        </p>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
