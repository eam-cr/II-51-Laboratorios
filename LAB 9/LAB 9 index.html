<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Canvas y Drag and Drop</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
        }

        /* ===== CANVAS ===== */
        canvas {
            border: 2px solid #000;
            display: block;
            margin-bottom: 10px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }

        /* ===== DRAG AND DROP ===== */
        h2 {
            margin-top: 40px;
        }

        .drag-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .drag-item {
            width: 120px;
            height: 120px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: grab;
        }

        .blue {
            background-color: #3498db;
        }

        .red {
            background-color: #e74c3c;
        }

        .drop-container {
            display: flex;
            gap: 20px;
        }

        .drop-box {
            width: 200px;
            height: 150px;
            border: 2px dashed #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- ===== CANVAS ===== -->
    <canvas id="miCanvas" width="500" height="250"></canvas>
    <button onclick="dibujarCirculo()">Dibujar círculo</button>

    <!-- ===== DRAG AND DROP ===== -->
    <h2>Drag and Drop</h2>

    <div class="drag-container">
        <div class="drag-item blue" draggable="true" id="drag1">
            Arrástrame
        </div>

        <div class="drag-item red" draggable="true" id="drag2">
            Arrástrame
        </div>
    </div>

    <div class="drop-container">
        <div class="drop-box" ondrop="soltar(event)" ondragover="permitirSoltar(event)">
            Caja 1
        </div>

        <div class="drop-box" ondrop="soltar(event)" ondragover="permitirSoltar(event)">
            Caja 2
        </div>

        <div class="drop-box" ondrop="soltar(event)" ondragover="permitirSoltar(event)">
            Caja 3
        </div>
    </div>

    <script>
        /* ===== CANVAS ===== */
        function dibujarCirculo() {
            const canvas = document.getElementById("miCanvas");
            const ctx = canvas.getContext("2d");

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(250, 125, 80, 0, Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();
            ctx.closePath();
        }

        /* ===== DRAG AND DROP ===== */
        const items = document.querySelectorAll(".drag-item");

        items.forEach(item => {
            item.addEventListener("dragstart", e => {
                e.dataTransfer.setData("text", e.target.id);
            });
        });

        function permitirSoltar(e) {
            e.preventDefault();
        }

        function soltar(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            const elemento = document.getElementById(id);
            e.target.appendChild(elemento);
        }
    </script>

</body>
</html>
