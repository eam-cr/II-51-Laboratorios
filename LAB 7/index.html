<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LAB 7</title>
  <link rel="stylesheet" href= "index.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

  <div class ="container mt-5">

  <h2>Formulario de prueba</h2>

  <form id="miFormulario">
    <div class ="form-group">

    <label>Nombre:</label>
      <input type="text" id="nombre" class="from-control" />
    </div><br><br>

    <div class ="form-group">
    <label>Apellido:</label>
      <input type="text" id="apellido" class="from-control" />
    </div><br><br>

    <button type="button" id="validarBtn" class="btn btn-primary">Validar</button>
  </form>

  <p id="mensaje"></p>

  <hr>

  <div id="bloqueTexto" class="caja">
    Este texto cambiará de color dinámicamente.
  </div>

  <button id="agregarClase" class="btn btn-success">Agregar clase</button>
  <button id="quitarClase" class="btn btn-secondary">Quitar clase</button>

  <hr>

  <button id="mostrarOcultar" class="btn btn-warning">Mostrar/Ocultar Elemento</button>
  <div id="elementoOculto" style="display:none;" class="alert alert-info my-3">Elemento oculto que puede mostrarse</div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
